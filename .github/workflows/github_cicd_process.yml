      if : ${{ !contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      run : bash .github/scripts/odbc_driver_install.sh

    # Step 13 - Install required python packages
    - name : Install python packages
      continue-on-error : false
      run : |
        python -m pip install --upgrade pip
        pip install requests

    # Step 14 - Get databricks token from Azure KeyVault
    - name : Get databricks token
      if :  steps.init.outputs.DATABRICKS_CONTROLLER  == 'true'
      run : |
        temp=$(az keyvault secret show --name ${{vars.AZ_DBX_KV_SECRET_KEY}} --vault-name ${{vars.AZ_DBX_KV_SECRET_SCOPE}} --query value -o tsv)
        echo "::add-mask::$temp"
        echo "dbx_token=$temp" >> "$GITHUB_OUTPUT"
      id : dbx_secret

    # Step 15 - Databricks CLI setup using databricks token
    - name : Databricks CLI setup to connect az KeyVault
      if :  steps.init.outputs.DATABRICKS_CONTROLLER  == 'true'
      run : |
        pip install "databricks-cli==0.18.0" "pyjwt==2.11.0"
        cat > ~/.databrickscfg << EOF 
        [DEFAULT] 
        host = ${{ vars.DATABRICKS_HOST_URL }} 
        token = ${{steps.dbx_secret.outputs.dbx_token}} 
        jobs-api-version = 2.1 
        EOF

    # Step 16 - Deploy only changed notebooks in databricks workspace using databricks-cli
    - name : Databricks - Deploy notebooks to workspace
      if :  steps.init.outputs.DATABRICKS_CONTROLLER  == 'true'
      run : |
        if [[ -d ./published_package/assets-for-download/notebooks/ ]] ; then
          databricks workspace import_dir ./published_package/assets-for-download/notebooks/ /projects/${{needs.build.outputs.REPO_SHORT_NAME}}  --overwrite
        else
          echo "No Databricks Notebook exists in this commit"
        fi

    # Step 17 - Deploy ADLS SQL script if present in databricks workspace using databricks-cli
    - name : Databricks - Deploy DDL scripts to workspace
      if :  steps.init.outputs.DATABRICKS_CONTROLLER  == 'true'
      id : scripts
      run : |
        if [[ -d ./published_package/assets-for-download/sql/databricks/ ]] ; then
          databricks workspace import_dir ./published_package/assets-for-download/sql/databricks/ /projects/${{needs.build.outputs.REPO_SHORT_NAME}}/sql/databricks  --overwrite
          echo "temp=true" >> $GITHUB_OUTPUT
          f=$(ls ./published_package/assets-for-download/sql/databricks/)
          for i in ${f}; do 
            echo "$i"; 
            done; 
          # expecting only one file in the folder
          IFS='.' read -ra arr <<< "$i"
          echo "dbx_notebook=${arr[0]}"

          IFS='.' read -ra arr <<< "$f"
          echo "dbx_notebook=${arr[0]}" >> $GITHUB_OUTPUT
        else
          echo "No Databricks Notebook exists in this commit"
          echo "temp=false" >> $GITHUB_OUTPUT
        fi

    # Step 18 - Check if JMS deployment required in this environment and if jms config changes present
    - name : Set jms status flag
      id : jms_status
      if :  ${{steps.init.outputs.DEPLOY_JMS_CONTROLLER}} == 'true'
      run : |
        if [[ -d ./published_package/assets-for-download/jms/ ]] ; then
          echo "DEPLOY_JMS_CONTROLLER = ${{steps.init.outputs.DEPLOY_JMS_CONTROLLER}}" 
          echo "jms_deployment_status=true" >> $GITHUB_OUTPUT
          output_string=""
          append=","
          
          for file in ./published_package/assets-for-download/jms/*; do
            echo "Processing $file"
            filename=$(basename -- "$file")
            echo "filename=$filename"
            prefix_str="./jms/"
            prefix_str+="$filename"
            output_string+="$prefix_str$append"
            done
          
          result_string="${output_string%,}"
          echo "jms config=$result_string"
          echo "result_string=$result_string" >> "$GITHUB_OUTPUT"
        else
          echo "No jms deployment"
          echo "jms_deployment_status=false"
          echo "DEPLOY_JMS_CONTROLLER = ${{env.DEPLOY_JMS_CONTROLLER}}"
          echo "jms_deployment_status=false" >> $GITHUB_OUTPUT
        fi

    # Step 19 - Generate values.yaml using template and provided jms configs
    - name : Python script to generate jms values
      if :  ${{ steps.jms_status.outputs.jms_deployment_status == 'true'  && steps.init.outputs.DEPLOY_JMS_CONTROLLER == 'true' }}
      run : python ./.github/scripts/trigger_jms_deployment.py
      env :
        TENANT_ID : ${{env.TENANT_ID}}
        SUBSCRIPTION_ID : ${{env.SUBSCRIPTION_ID_NON_PROD}}
        ENVIRONMENT_SHORT : ${{env.ENV_NAME}}
        JMS_CONFIG : ${{steps.jms_status.outputs.result_string}}
        MQ_HOST : ${{env.MQ_HOST}}
        MQ_CHANNEL : ${{env.MQ_CHANNEL}}
        KAFKA_SERVERS_CONFLUENT : ${{env.KAFKA_SERVERS_CONFLUENT}}
        KAFKA_SERVERS_ENTERPRISE : ${{env.KAFKA_SERVERS_ENTERPRISE}}
        K8S_CLUSTER : ${{env.K8S_CLUSTER}}
        K8S_NAMESPACE : ${{env.K8S_NAMESPACE}}
        LANDING_ACCOUNT : ${{env.LANDING_ACCOUNT}}
        K8S_URL : ${{env.K8S_URL}}
        K8S_SECRET : ${{env.K8S_SECRET}}
        authorization_pat : ${{ env.GH_TOKEN }}
        repo_name : ${{ env.repo_name }}
        ref_branch : ${{github.head_ref || github.ref_name}}

    # Step 20 - Identify SQL scripts (if any) in current PR for AzSQLDB deployment
    - name : Identify SQL scripts for AzSQLDB deployment
      continue-on-error : true
      if :  steps.init.outputs.DEPLOY_AZSQL  == 'true'
      id : azsqldb_scripts
      run : |
        if [[ -d ./published_package/assets-for-download/sql/azsqldb/ ]] ; then
          echo "sql_temp=true" >> $GITHUB_OUTPUT
          f=$(ls ./published_package/assets-for-download/sql/azsqldb/)
          for i in ${f}; do 
            echo "$i"; 
            done;
          # expecting only one file in the folder
          IFS='.' read -ra arr <<< "$i"
          echo "azsqldb_script=${arr[0]}"

          IFS='.' read -ra arr <<< "$f"
          echo "azsqldb_script=${arr[0]}" >> $GITHUB_OUTPUT
        else
          echo "No AzSQL DB script exists in this commit"
          echo "sql_temp=false" >> $GITHUB_OUTPUT
        fi

    # Step 21 - Get AzSQL DB connection token from GEN KeyVault and replace environment variables in the SQL script
    - name : Get AzSQL DB connection token
      continue-on-error : true 
      if : ${{ steps.azsqldb_scripts.outputs.sql_temp == 'true' && steps.init.outputs.DEPLOY_AZSQL  == 'true'}}
      run : |
        temp=$(az keyvault secret show --name ${{vars.AZSQLDB_KV_SECRETKEY}} --vault-name ${{vars.AZ_GEN_KV_SECRET_SCOPE}} --query value -o tsv)
        echo "::add-mask::$temp"
        echo "azsql_token=$temp" >> "$GITHUB_OUTPUT"
        sed -i -E 's/\$[eE][nN][vV]|\$\([eE][nN][vV]\)|\$\{[eE][nN][vV]\}/sit/g' ./sql/azsqldb/${{steps.azsqldb_scripts.outputs.azsqldb_script}}.sql
        cat ./sql/azsqldb/${{steps.azsqldb_scripts.outputs.azsqldb_script}}.sql
      id : azsql_secret

    # Step 22 - Run AzSQL script in AzSQL DB based on retrieved connection token
    - name : AzSQLDB automated run [ DDL script execution] ******** validation required  ********
      id : ddl_azsqldb_deployment
      continue-on-error : true
      if : ${{ steps.azsqldb_scripts.outputs.sql_temp == 'true' && steps.init.outputs.DEPLOY_AZSQL  == 'true'}}
      uses : azure/sql-action@v2.2
      with :
        connection-string : ${{steps.azsql_secret.outputs.azsql_token}}
        path : ./sql/azsqldb/${{steps.azsqldb_scripts.outputs.azsqldb_script}}.sql

    # Step 23 - Identify SQL scripts (if any) in current PR for Synapse deployment
    - name : Identify SQL scripts for Synapse deployment
      continue-on-error : true
      if :  steps.init.outputs.DEPLOY_SYNAPSE  == 'true'
      id : synapse_scripts
      run : |
        if [[ -d ./published_package/assets-for-download/sql/synapse/ ]] ; then
          echo "synapse_temp=true" >> $GITHUB_OUTPUT
          f=$(ls ./published_package/assets-for-download/sql/synapse/)
          for i in ${f}; do 
            echo "$i"; 
            done; 
          # expecting only one file in the folder
          IFS='.' read -ra arr <<< "$i"
          echo "synapse_script=${arr[0]}"

          IFS='.' read -ra arr <<< "$f"
          echo "synapse_script=${arr[0]}" >> $GITHUB_OUTPUT
        else
          echo "No synapse script exists in this commit"
          echo "synapse_temp=false" >> $GITHUB_OUTPUT
        fi
        
     
    # Step 24 - Get Synapse connection token from GEN KeyVault and replace environment variables in the SQL script
    - name : Get Synapse connection token
      continue-on-error : true
      if : ${{ steps.synapse_scripts.outputs.synapse_temp == 'true' && steps.init.outputs.DEPLOY_SYNAPSE  == 'true'}}
      run : |
        temp=$(az keyvault secret show --name ${{vars.SYNAPSE_KV_SECRETKEY}} --vault-name ${{vars.AZ_GEN_KV_SECRET_SCOPE}} --query value -o tsv)
        echo "::add-mask::$temp"
        echo "synapse_token=$temp" >> "$GITHUB_OUTPUT"
        sed -i -E 's/\$[eE][nN][vV]|\$\([eE][nN][vV]\)|\$\{[eE][nN][vV]\}/sit/g' ./sql/synapse/${{steps.synapse_scripts.outputs.synapse_script}}.sql
        cat ./sql/synapse/${{steps.synapse_scripts.outputs.synapse_script}}.sql
      id : synapse_secret

    # Step 25 - Run SQL script in Synapse based on retrieved connection token
    - name : Synapse automated run [ DDL script execution] ******** validation required  ********
      id : ddl_synapse_deployment
      continue-on-error : true
      if : ${{ steps.synapse_scripts.outputs.synapse_temp == 'true' && steps.init.outputs.DEPLOY_SYNAPSE == 'true'}}
      uses : azure/sql-action@v2.2
      with :
        connection-string : ${{steps.synapse_secret.outputs.synapse_token}}
        path : ./sql/synapse/${{steps.synapse_scripts.outputs.synapse_script}}.sql
        

    # Step 23.1 - Identify SQL scripts (if any) in current PR for Synapse 02 instance deployment
    - name : Identify SQL scripts for Synapse 02 instance deployment
      continue-on-error : true
      if :  steps.init.outputs.DEPLOY_SYNAPSE_02_INSTANCE  == 'true'
      id : synapse_scripts_02_instance
      run : |
        if [[ -d ./published_package/assets-for-download/sql/synapse_02_instance/ ]] ; then
          echo "synapse_temp_02=true" >> $GITHUB_OUTPUT
          f=$(ls ./published_package/assets-for-download/sql/synapse_02_instance/)
          for i in ${f}; do 
            echo "$i"; 
            done; 
          # expecting only one file in the folder
          IFS='.' read -ra arr <<< "$i"
          echo "synapse_script_02_instance=${arr[0]}"

          IFS='.' read -ra arr <<< "$f"
          echo "synapse_script_02_instance=${arr[0]}" >> $GITHUB_OUTPUT
        else
          echo "No synapse script exists in this commit"
          echo "synapse_temp_02=false" >> $GITHUB_OUTPUT
        fi


    # Step 24.1 - Get Synapse connection token(for 02 instance) from GEN KeyVault and replace environment variables in the SQL script
    - name : Get connection token for synapse 02 instance (synapse managed)
      continue-on-error : true
      if : ${{ steps.synapse_scripts_02_instance.outputs.synapse_temp_02 == 'true' && steps.init.outputs.DEPLOY_SYNAPSE_02_INSTANCE  == 'true'}}
      run : |
        temp=$(az keyvault secret show --name ${{vars.SYNAPSE_KV_SECRETKEY_02_INSTANCE}} --vault-name ${{vars.AZ_GEN_KV_SECRET_SCOPE}} --query value -o tsv)
        echo "::add-mask::$temp"
        echo "synapse_token=$temp" >> "$GITHUB_OUTPUT"
        sed -i -E 's/\$[eE][nN][vV]|\$\([eE][nN][vV]\)|\$\{[eE][nN][vV]\}/sit/g' ./sql/synapse_02_instance/${{steps.synapse_scripts_02_instance.outputs.synapse_script_02_instance}}.sql
        cat ./sql/synapse_02_instance/${{steps.synapse_scripts_02_instance.outputs.synapse_script_02_instance}}.sql
      id : synapse_secret_02_instance

    # Step 25.1 - Run SQL script in Synapse based on retrieved connection token
    - name : Synapse(02) managed instance automated run [ DDL script execution] ******** validation required  ********
      id : ddl_synapse_deployment_02_instance
      continue-on-error : true
      if : ${{ steps.synapse_scripts_02_instance.outputs.synapse_temp_02 == 'true' && steps.init.outputs.DEPLOY_SYNAPSE_02_INSTANCE == 'true'}}
      uses : azure/sql-action@v2.2
      with :
        connection-string : ${{steps.synapse_secret_02_instance.outputs.synapse_token}}
        path : ./sql/synapse_02_instance/${{steps.synapse_scripts_02_instance.outputs.synapse_script_02_instance}}.sql


    # Step 26 - Run SQL script in Databricks using databricks notebook run action 
    - name : Databricks Execution [ DDL script automated run ] ******** validation required  ********
      id : ddl_dbx_deployment
      continue-on-error : true  
      if : ${{ steps.scripts.outputs.temp == 'true' && steps.init.outputs.DATABRICKS_CONTROLLER  == 'true' && steps.init.outputs.DBX_AUTOMATED_DDL_CONTROLLER  == 'true' }}
      uses : databricks/run-notebook@v0
      with :
        workspace-notebook-path : /projects/${{needs.build.outputs.REPO_SHORT_NAME}}/sql/databricks/${{ steps.scripts.outputs.dbx_notebook }}
        databricks-host : ${{ vars.DATABRICKS_HOST_URL }}
        databricks-token : ${{steps.dbx_secret.outputs.dbx_token}}
        notebook-params-json : "[{\"key\":\"env\",\"value\":\"sit\"}]"
        timeout-seconds : ${{vars.DBX_PROCESS_TIMEOUT}}
        run-name : "https://github.com/DigitalInnovation/${{env.repo_name}} : ${{ steps.scripts.outputs.dbx_notebook }}"
        new-cluster-json: >
          {
            "num_workers": ${{vars.DBX_WORKER_COUNT}},
            "spark_version": "${{vars.DBX_RUNTIME_VERSION}}",
            "node_type_id": "${{vars.DBX_NODE_TYPE}}",
            "driver_node_type_id": "${{vars.DBX_NODE_TYPE}}",
            "init_scripts": [
              {
                "${{vars.DBX_INIT_SCRIPT_PLACEHOLDER}}": {
                  "destination": "${{vars.INIT_SCRIPT}}"
                }
              }
            ]
          }
      timeout-minutes: 30
    # Step 27 - Storage Account Dynamic Whitelist removal for GitHub hosted runner
    - name : Storage Account Whitelist removal for GitHub hosted runner - Check and add agent IP
      if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      shell : pwsh
      run : |
        $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
        write-output "GitHub Agent IP address '$agentIP'"
        az storage account network-rule remove --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} --ip-address $agentIP --resource-group ${{vars.AZURE_RESOURCE_GROUP}}

    # Step 28 - GEN and DBK Keyvault Dynamic Whitelist removal for GitHub hosted runner
    - name : Keyvault Whitelist removal for GitHub hosted runner - Check and add agent IP
      if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      shell : pwsh
      run : |
        $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
        write-output "GitHub Agent IP address '$agentIP'"
        az keyvault network-rule remove --resource-group "${{vars.AZ_KV_RG}}" --name "${{vars.AZ_DBX_KV_SECRET_SCOPE}}" --ip-address $agentIP
        az keyvault network-rule remove --resource-group "${{vars.AZ_KV_RG}}" --name "${{vars.AZ_GEN_KV_SECRET_SCOPE}}" --ip-address $agentIP

    # Step 29 - Echo environment output
    - name : Echo the output
      run : |
        echo "azsql_deployment=${{ steps.ddl_azsqldb_deployment.outcome }}"
        echo "synapse_deployment=${{ steps.ddl_synapse_deployment.outcome }}"
        echo "dbx_deployment=${{ steps.ddl_dbx_deployment.outcome }}"
      if : always()

    # Step 30 - Check if SQL deployment is success and update environment variable
    - name : Check deployment status
      id : deployment_status
      if : ${{ steps.ddl_azsqldb_deployment.outcome != 'success' || steps.ddl_synapse_deployment.outcome != 'success' || steps.ddl_dbx_deployment.outcome != 'success' }}
      run : |
        if [ "${{ steps.ddl_azsqldb_deployment.outcome }}" = "success" ] ; then
          echo "azsql_deployment=true" >> $GITHUB_ENV
        else 
          echo "azsql_deployment=false" >> $GITHUB_ENV
        fi
        if [ "${{ steps.ddl_synapse_deployment.outcome }}" = "success" ] ; then
          echo "synapse_deployment=true" >> $GITHUB_ENV
        else 
          echo "synapse_deployment=false" >> $GITHUB_ENV
        fi
        if [ "${{ steps.ddl_dbx_deployment.outcome }}" = "success" ] ; then
          echo "dbx_deployment=true" >> $GITHUB_ENV
        else 
          echo "dbx_deployment=false" >> $GITHUB_ENV
        fi

    # Step 31 - Azure logout for Non Prod service principal
    - name: Azure logout
      run: |
        az logout
      if: always() 

    # Step 32 - Login to Azure using Prod service principal
    - name : Login to Azure
      uses : azure/login@v1
      with : 
        creds : ${{env.AZURE_CREDENTIALS_PROD}}

    # Step 33 - Prod GEN Keyvault Dynamic Whitelist for GitHub hosted runner
    - name : Prod Keyvault Whitelist for GitHub hosted runner - Check and add agent IP
      if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      shell : pwsh
      run : |
        $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
        write-output "GitHub Agent IP address '$agentIP'"
        az keyvault network-rule add --resource-group "${{vars.AZ_KV_RG_CENTRAL}}" --name "${{vars.AZ_GEN_KV_SECRET_SCOPE_CENTRAL}}" --ip-address $agentIP

    # Step 34 - Update audit log with required details with deployment status
    - name : Audit Log update
      run : |
        python ./.github/scripts/audit_update.py
      env :
        envname : "${{env.ENV_NAME}}"
        key_vault_name : ${{vars.AZ_GEN_KV_SECRET_SCOPE_CENTRAL}}
        secret_name : ${{vars.AUDIT_AZSQLDB_KV_SECRETKEY}}
        CLINET_ID : ${{env.CLINET_ID_PROD}}
        CLINET_SECRET : ${{env.CLINET_SECRET_PROD}}

    # Step 35 - Prod GEN Keyvault Whitelist removal for GitHub hosted runner
    - name : Prod Keyvault Whitelist removal for GitHub hosted runner - Check and add agent IP
      if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      shell : pwsh
      run : |
        $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
        write-output "GitHub Agent IP address '$agentIP'"
        az keyvault network-rule remove --resource-group "${{vars.AZ_KV_RG_CENTRAL}}" --name "${{vars.AZ_GEN_KV_SECRET_SCOPE_CENTRAL}}" --ip-address $agentIP

    # Step 36 - Azure logout for Prod service principal
    - name : Azure logout
      run : |
        az logout
      if : always()

# PPD Deployment  
  deploy-to-PPD:
    name : Deploy to PPD
    # Runs for PR event only and depends on SIT deployment
    needs: [ build,deploy-to-SIT ]
    # The type of runner that the job will run on repo variable
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL) }}
    environment : 
      name : PPD
      #url : 'http://ppd.myapp.com'
    outputs:
      script_folder_exists: ${{ steps.scripts.outputs.temp }} 
      dbx_notebook : ${{ steps.scripts.outputs.dbx_notebook }}
    steps: 

    # Step 1 - Login to Azure using Prod service principal
    - name : Login to Azure
      uses : azure/login@v1
      with : 
        creds : ${{secrets.AZURE_CREDENTIALS_PROD}}

    # Step 2 - Checkout the repository with fetch depth as 2
    - name : Checkout Source Code
      uses : actions/checkout@v3
      with : 
        fetch-depth: ${fetch_depth}

    # Step 3 - Download the artifacts from the build job
    - name : Download Artifacts
      uses : actions/download-artifact@v4
      with :
        path : published_package

    # Step 4 - Initialize variable to be used later on
    - name : Initialize variable
      id : init
      shell : bash
      run: |
        echo "DATABRICKS_CONTROLLER=${{ fromJSON(vars.ACTIVITY_CONTROLLER)['DEPLOY_DATABRICKS']}}" >> $GITHUB_OUTPUT
        echo "DEPLOY_CONFIG_CONTROLLER=${{ fromJSON(vars.ACTIVITY_CONTROLLER)['DEPLOY_CONFIG']}}" >> $GITHUB_OUTPUT
        echo "DEPLOY_SCHEMA_CONTROLLER=${{ fromJSON(vars.ACTIVITY_CONTROLLER)['DEPLOY_SCHEMA']}}" >> $GITHUB_OUTPUT
        echo "DEPLOY_JMS_CONTROLLER=${{ fromJSON(vars.ACTIVITY_CONTROLLER)['DEPLOY_JMS']}}" >> $GITHUB_OUTPUT
        echo "DBX_AUTOMATED_DDL_CONTROLLER=${{ fromJSON(vars.ACTIVITY_CONTROLLER)['DEPLOY_AUTOMATED_DDL_IN_DBX']}}" >> $GITHUB_OUTPUT
        echo "DEPLOY_AZSQL=${{ fromJSON(vars.ACTIVITY_CONTROLLER)['DEPLOY_AZURESQL']}}" >> $GITHUB_OUTPUT
        echo "DEPLOY_SYNAPSE=${{ fromJSON(vars.ACTIVITY_CONTROLLER)['DEPLOY_SYNAPSE']}}" >> $GITHUB_OUTPUT
        echo "DEPLOY_SYNAPSE_02_INSTANCE=${{ fromJSON(vars.ACTIVITY_CONTROLLER)['DEPLOY_SYNAPSE_02_INSTANCE']}}" >> $GITHUB_OUTPUT
        echo "ENV_NAME=PPD" >> $GITHUB_ENV
        
        # jms deployment variables
        echo "MQ_HOST=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['MQ_HOST']}}" >> $GITHUB_ENV
        echo "MQ_CHANNEL=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['MQ_CHANNEL']}}" >> $GITHUB_ENV
        echo "KAFKA_SERVERS_CONFLUENT=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['KAFKA_SERVERS_CONFLUENT']}}" >> $GITHUB_ENV
        echo "KAFKA_SERVERS_ENTERPRISE=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['KAFKA_SERVERS_ENTERPRISE']}}" >> $GITHUB_ENV
        echo "K8S_CLUSTER=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['K8S_CLUSTER']}}" >> $GITHUB_ENV
        echo "K8S_NAMESPACE=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['K8S_NAMESPACE']}}" >> $GITHUB_ENV
        echo "LANDING_ACCOUNT=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['LANDING_ACCOUNT']}}" >> $GITHUB_ENV
        echo "K8S_URL=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['K8S_URL']}}" >> $GITHUB_ENV
        echo "K8S_SECRET=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['K8S_SECRET']}}" >> $GITHUB_ENV

    # Step 5 - Storage Account Dynamic Whitelist for GitHub hosted runner
    - name : Storage Account Whitelist for GitHub hosted runner - Check and add agent IP
      if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      shell : pwsh
      run : |
        $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
        write-output "GitHub Agent IP address '$agentIP'"
        write-output "Network rule list - "
        az storage account network-rule list --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} --resource-group ${{vars.AZURE_RESOURCE_GROUP}}
        az storage account network-rule add --resource-group ${{vars.AZURE_RESOURCE_GROUP}} --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} --ip-address $agentIP

    # Step 6 - GEN and DBK Keyvault Dynamic Whitelist for GitHub hosted runner
    - name : Keyvault Whitelist for GitHub hosted runner - Check and add agent IP
      if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      shell : pwsh
      run : |
        $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
        write-output "GitHub Agent IP address '$agentIP'"
        az keyvault network-rule add --resource-group "${{vars.AZ_KV_RG}}" --name "${{vars.AZ_DBX_KV_SECRET_SCOPE}}" --ip-address $agentIP
        az keyvault network-rule add --resource-group "${{vars.AZ_KV_RG}}" --name "${{vars.AZ_GEN_KV_SECRET_SCOPE}}" --ip-address $agentIP

    # Step 7.0 - Deploy Wheel files if present using Az CLI using service principal login
    - name : Deploy Wheel files in azure storage using Az CLI
      if : steps.init.outputs.DEPLOY_CONFIG_CONTROLLER == 'true'
      uses : azure/CLI@v1
      with :
        azcliversion : latest
        inlineScript : |
          if [[ -d ./published_package/assets-for-download/prophecy/pipelines/ ]] ; then
            ls
            az login --service-principal --username ${{env.CLINET_ID_PROD}} --password ${{env.CLINET_SECRET_PROD}} --tenant ${{env.TENANT_ID}}
            for dir in ./published_package/assets-for-download/prophecy/pipelines/*/; do prophecy_pipeline=$(basename "$dir"); ls ./published_package/assets-for-download/prophecy/pipelines/${prophecy_pipeline}/code/dist/*.whl; az storage blob upload-batch --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} -d 'projects' --destination-path ${{needs.build.outputs.REPO_SHORT_NAME}}/prophecy_executables -s ./published_package/assets-for-download/prophecy/pipelines/${prophecy_pipeline}/code/dist/   --overwrite  --auth-mode login; done            
          else
            echo "No Wheel file changes"
          fi	

    # Step 7 - Deploy config files if present using Az CLI using service principal login
    - name : Deploy config files to azure storage using Az CLI
      if : steps.init.outputs.DEPLOY_CONFIG_CONTROLLER == 'true'
      uses : azure/CLI@v1
      with :
        azcliversion : latest
        inlineScript : |
          if [[ -d ./published_package/assets-for-download/configs/ ]] ; then
            ls
            az login --service-principal --username ${{env.CLINET_ID_PROD}} --password ${{env.CLINET_SECRET_PROD}} --tenant ${{env.TENANT_ID}}
            az storage blob upload-batch --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} -d 'projects' --destination-path ${{needs.build.outputs.REPO_SHORT_NAME}}/configs -s ./published_package/assets-for-download/configs  --overwrite  --auth-mode login  
          else
            echo "No Config file changes"
          fi

    # Step 8 - Deploy schema files if present using Az CLI using service principal login
    - name : Deploy schema files in azure storage using Az CLI
      if : steps.init.outputs.DEPLOY_SCHEMA_CONTROLLER == 'true'
      uses : azure/CLI@v1
      with :
        azcliversion : latest
        inlineScript : |
          if [[ -d ./published_package/assets-for-download/schemas/ ]] ; then
            ls  
            az login --service-principal --username ${{env.CLINET_ID_PROD}} --password ${{env.CLINET_SECRET_PROD}} --tenant ${{env.TENANT_ID}}
            az storage blob upload-batch --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} -d 'projects' --destination-path ${{needs.build.outputs.REPO_SHORT_NAME}}/schemas -s ./published_package/assets-for-download/schemas --overwrite  --auth-mode login
          else
            echo "No schema file changes"
          fi

    # Step 9 - Deploy jms config files if present using Az CLI using service principal login
    - name : Deploy jms config files in azure storage using Az CLI
      if : steps.init.outputs.DEPLOY_JMS_CONTROLLER == 'true'
      uses : azure/CLI@v1
      with :
        azcliversion : latest
        inlineScript : |
          if [[ -d ./published_package/assets-for-download/jms/ ]] ; then
            ls
            az login --service-principal --username ${{env.CLINET_ID_PROD}} --password ${{env.CLINET_SECRET_PROD}} --tenant ${{env.TENANT_ID}}
            az storage blob upload-batch --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} -d 'projects' --destination-path ${{needs.build.outputs.REPO_SHORT_NAME}}/jms -s ./published_package/assets-for-download/jms --overwrite  --auth-mode login
          else
            echo "No jms config file changes"
          fi

    # Step 10 - Setup Python with required version
    - name : Setup python
      uses : actions/setup-python@v4
      with :
        python-version : ${{ vars.PYTHON_VERSION }}

    # Step 11 - Install ODBC Driver Manager for GitHub Hosted Runner
    - name : Install ODBC Driver Manager for GitHub Hosted Runner
      if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      run : |
        sudo curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
        sudo curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17
        # optional: for bcp and sqlcmd
        sudo ACCEPT_EULA=Y apt-get install -y mssql-tools
        echo 'export PATH="$PATH:/opt/mssql-tools/bin"' >> ~/.bashrc
        source ~/.bashrc
        # optional: for unixODBC development headers
        sudo apt-get install -y unixodbc-dev
        python -m pip install pyodbc

    # Step 12 - Install ODBC Driver Manager for Self Hosted Runner
    - name : Install ODBC Driver Manager for Self Hosted Runner
      if : ${{ !contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      run : bash .github/scripts/odbc_driver_install.sh

    # Step 13 - Install required python packages
    - name : install python packages
      run : |
        python -m pip install --upgrade pip
        pip install requests
        python -m pip install PyYAML

    # Step 14 - Get databricks token from Azure KeyVault
    - name : Get databricks token
      if : steps.init.outputs.DATABRICKS_CONTROLLER  == 'true'
      run : |
        temp=$(az keyvault secret show --name ${{vars.AZ_DBX_KV_SECRET_KEY}} --vault-name ${{vars.AZ_DBX_KV_SECRET_SCOPE}} --query value -o tsv)
        echo "::add-mask::$temp"
        echo "dbx_token=$temp" >> "$GITHUB_OUTPUT"
      id : dbx_secret

    # Step 15 - Databricks CLI setup using databricks token
    - name : Databricks CLI setup to connect az KeyVault
      if : steps.init.outputs.DATABRICKS_CONTROLLER  == 'true'
      run : |
        pip install "databricks-cli==0.18.0" "pyjwt==2.11.0"
        cat > ~/.databrickscfg << EOF 
        [DEFAULT] 
        host = ${{ vars.DATABRICKS_HOST_URL }} 
        token = ${{steps.dbx_secret.outputs.dbx_token}} 
        jobs-api-version = 2.1 
        EOF

    # Step 16 - Deploy only changed notebooks in databricks workspace using databricks-cli
    - name : Databricks - Deploy notebooks to workspace
      if :  steps.init.outputs.DATABRICKS_CONTROLLER  == 'true'
      run: |
        if [[ -d ./published_package/assets-for-download/notebooks/ ]] ; then
          databricks workspace import_dir ./published_package/assets-for-download/notebooks/ /projects/${{needs.build.outputs.REPO_SHORT_NAME}}  --overwrite
        else
          echo "No Databricks Notebook exists in this commit"
        fi

    # Step 17 - Deploy ADLS SQL script if present in databricks workspace using databricks-cli
    - name : Databricks - Deploy DDL scripts to workspace
      if :  steps.init.outputs.DATABRICKS_CONTROLLER  == 'true'
      id : scripts
      run : |
        if [[ -d ./published_package/assets-for-download/sql/databricks/ ]] ; then
          databricks workspace import_dir ./published_package/assets-for-download/sql/databricks/ /projects/${{needs.build.outputs.REPO_SHORT_NAME}}/sql/databricks  --overwrite
          echo "temp=true" >> $GITHUB_OUTPUT
          f=$(ls ./published_package/assets-for-download/sql/databricks/)
          for i in ${f}; do 
            echo "$i"; 
            done; 
          # expecting only one file in the folder
          IFS='.' read -ra arr <<< "$i"
          echo "dbx_notebook=${arr[0]}"

          IFS='.' read -ra arr <<< "$f"
          echo "dbx_notebook=${arr[0]}" >> $GITHUB_OUTPUT
        else
          echo "No Databricks Notebook exists in this commit"
          echo "temp=false" >> $GITHUB_OUTPUT
        fi

    # Step 18 - Check if JMS deployment required in this environment and if jms config changes present
    - name : Get jms status flag
      id : jms_status
      if :  ${{steps.init.outputs.DEPLOY_JMS_CONTROLLER}} == 'true'
      run : |
        if [[ -d ./published_package/assets-for-download/jms/ ]] ; then
          echo "DEPLOY_JMS_CONTROLLER = ${{steps.init.outputs.DEPLOY_JMS_CONTROLLER}}" 
          echo "jms_deployment_status=true" >> $GITHUB_OUTPUT
          output_string=""
          append=","
          
          for file in ./published_package/assets-for-download/jms/*; do
            echo "Processing $file"
            filename=$(basename -- "$file")
            echo "filename=$filename"
            prefix_str="./jms/"
            prefix_str+="$filename"
            output_string+="$prefix_str$append"
            done
              
          result_string="${output_string%,}"
          echo "jms config=$result_string"
          echo "result_string=$result_string" >> "$GITHUB_OUTPUT"
        else
          echo "No jms deployment"
          echo "jms_deployment_status=false"
          echo "DEPLOY_JMS_CONTROLLER = ${{env.DEPLOY_JMS_CONTROLLER}}"
          echo "jms_deployment_status=false" >> $GITHUB_OUTPUT
        fi

    # Step 19 - Generate values.yaml using template and provided jms configs
    - name : python script to generate jms values
      if : ${{ steps.jms_status.outputs.jms_deployment_status == 'true'  && steps.init.outputs.DEPLOY_JMS_CONTROLLER == 'true' }}
      run : python ./.github/scripts/trigger_jms_deployment.py
      env :
        TENANT_ID : ${{env.TENANT_ID}}
        SUBSCRIPTION_ID : ${{env.SUBSCRIPTION_ID_PROD}}
        ENVIRONMENT_SHORT : ${{env.ENV_NAME}}
        JMS_CONFIG : ${{steps.jms_status.outputs.result_string}}
        MQ_HOST : ${{env.MQ_HOST}}
        MQ_CHANNEL : ${{env.MQ_CHANNEL}}
        KAFKA_SERVERS_CONFLUENT : ${{env.KAFKA_SERVERS_CONFLUENT}}
        KAFKA_SERVERS_ENTERPRISE : ${{env.KAFKA_SERVERS_ENTERPRISE}}
        K8S_CLUSTER : ${{env.K8S_CLUSTER}}
        K8S_NAMESPACE : ${{env.K8S_NAMESPACE}}
        LANDING_ACCOUNT : ${{env.LANDING_ACCOUNT}}
        K8S_URL : ${{env.K8S_URL}}
        K8S_SECRET : ${{env.K8S_SECRET}}
        authorization_pat : ${{ env.GH_TOKEN }}
        repo_name : ${{ env.repo_name }}
        ref_branch : ${{github.head_ref || github.ref_name}}

    # Step 20 - Identify SQL scripts (if any) in current PR for AzSQLDB deployment  
    - name : Identify SQL scripts for AzSQLDB deployment
      continue-on-error : true
      if :  steps.init.outputs.DEPLOY_AZSQL  == 'true'
      id : azsqldb_scripts
      run : |
        if [[ -d ./published_package/assets-for-download/sql/azsqldb/ ]] ; then
          echo "sql_temp=true" >> $GITHUB_OUTPUT
          f=$(ls ./published_package/assets-for-download/sql/azsqldb/)
          for i in ${f}; do 
            echo "$i"; 
            done; 
          # expecting only one file in the folder
          IFS='.' read -ra arr <<< "$i"
          echo "azsqldb_script=${arr[0]}"

          IFS='.' read -ra arr <<< "$f"
          echo "azsqldb_script=${arr[0]}" >> $GITHUB_OUTPUT
        else
          echo "No AzSQL DB script exists in this commit"
          echo "sql_temp=false" >> $GITHUB_OUTPUT
        fi

    # Step 21 - Get AzSQL DB connection token from GEN KeyVault and replace environment variables in the SQL script
    - name : Get AzSQL DB connection token
      continue-on-error : true
      if : ${{ steps.azsqldb_scripts.outputs.sql_temp == 'true' && steps.init.outputs.DEPLOY_AZSQL  == 'true'}}
      run : |
        temp=$(az keyvault secret show --name ${{vars.AZSQLDB_KV_SECRETKEY}} --vault-name ${{vars.AZ_GEN_KV_SECRET_SCOPE}} --query value -o tsv)
        echo "::add-mask::$temp"
        echo "azsql_token=$temp" >> "$GITHUB_OUTPUT"
        sed -i -E 's/\$[eE][nN][vV]|\$\([eE][nN][vV]\)|\$\{[eE][nN][vV]\}/ppd/g' ./sql/azsqldb/${{steps.azsqldb_scripts.outputs.azsqldb_script}}.sql
        cat ./sql/azsqldb/${{steps.azsqldb_scripts.outputs.azsqldb_script}}.sql
      id : azsql_secret

    # Step 22 - Run AzSQL script in AzSQL DB based on retrieved connection token
    - name : AzSQLDB automated run [ DDL script execution] ******** validation required  ********
      id : ddl_azsqldb_deployment
      continue-on-error : true
      if : ${{ steps.azsqldb_scripts.outputs.sql_temp == 'true' && steps.init.outputs.DEPLOY_AZSQL  == 'true'}}
      uses : azure/sql-action@v2.2
      with :
        connection-string : ${{steps.azsql_secret.outputs.azsql_token}}
        path : ./sql/azsqldb/${{steps.azsqldb_scripts.outputs.azsqldb_script}}.sql

    # Step 23 - Identify SQL scripts (if any) in current PR for Synapse deployment
    - name : Identify SQL scripts for Synapse deployment
      continue-on-error : true
      if : steps.init.outputs.DEPLOY_SYNAPSE  == 'true'
      id : synapse_scripts
      run : |
        if [[ -d ./published_package/assets-for-download/sql/synapse/ ]] ; then
          echo "synapse_temp=true" >> $GITHUB_OUTPUT
          f=$(ls ./published_package/assets-for-download/sql/synapse/)
          for i in ${f}; do 
            echo "$i"; 
            done; 
          # expecting only one file in the folder
          IFS='.' read -ra arr <<< "$i"
          echo "synapse_script=${arr[0]}"

          IFS='.' read -ra arr <<< "$f"
          echo "synapse_script=${arr[0]}" >> $GITHUB_OUTPUT
        else
          echo "No synapse script exists in this commit"
          echo "synapse_temp=false" >> $GITHUB_OUTPUT
        fi

    # Step 24 - Get Synapse connection token from GEN KeyVault and replace environment variables in the SQL script
    - name : Get Synapse connection token
      continue-on-error : true
      if : ${{ steps.synapse_scripts.outputs.synapse_temp == 'true' && steps.init.outputs.DEPLOY_SYNAPSE  == 'true'}}
      run : |
        temp=$(az keyvault secret show --name ${{vars.SYNAPSE_KV_SECRETKEY}} --vault-name ${{vars.AZ_GEN_KV_SECRET_SCOPE}} --query value -o tsv)
        echo "::add-mask::$temp"
        echo "synapse_token=$temp" >> "$GITHUB_OUTPUT"
        sed -i -E 's/\$[eE][nN][vV]|\$\([eE][nN][vV]\)|\$\{[eE][nN][vV]\}/ppd/g' ./sql/synapse/${{steps.synapse_scripts.outputs.synapse_script}}.sql
        cat ./sql/synapse/${{steps.synapse_scripts.outputs.synapse_script}}.sql
      id : synapse_secret

    # Step 25 - Run SQL script in Synapse based on retrieved connection token
    - name : Synapse automated run [ DDL script execution] ******** validation required  ********
      id : ddl_synapse_deployment
      continue-on-error : true
      if : ${{ steps.synapse_scripts.outputs.synapse_temp == 'true' && steps.init.outputs.DEPLOY_SYNAPSE == 'true'}}
      uses : azure/sql-action@v2.2
      with :        
        connection-string : ${{steps.synapse_secret.outputs.synapse_token}}
        path : ./sql/synapse/${{steps.synapse_scripts.outputs.synapse_script}}.sql
        
        
    # Step 23.1 - Identify SQL scripts (if any) in current PR for Synapse 02 instance deployment
    - name : Identify SQL scripts for Synapse 02 instance deployment
      continue-on-error : true
      if :  steps.init.outputs.DEPLOY_SYNAPSE_02_INSTANCE  == 'true'
      id : synapse_scripts_02_instance
      run : |
        if [[ -d ./published_package/assets-for-download/sql/synapse_02_instance/ ]] ; then
          echo "synapse_temp_02=true" >> $GITHUB_OUTPUT
          f=$(ls ./published_package/assets-for-download/sql/synapse_02_instance/)
          for i in ${f}; do 
            echo "$i"; 
            done; 
          # expecting only one file in the folder
          IFS='.' read -ra arr <<< "$i"
          echo "synapse_script_02_instance=${arr[0]}"

          IFS='.' read -ra arr <<< "$f"
          echo "synapse_script_02_instance=${arr[0]}" >> $GITHUB_OUTPUT
        else
          echo "No synapse script exists in this commit"
          echo "synapse_temp_02=false" >> $GITHUB_OUTPUT
        fi


    # Step 24.1 - Get Synapse connection token(for 02 instance) from GEN KeyVault and replace environment variables in the SQL script
    - name : Get connection token for synapse 02 instance (synapse managed)
      continue-on-error : true
      if : ${{ steps.synapse_scripts_02_instance.outputs.synapse_temp_02 == 'true' && steps.init.outputs.DEPLOY_SYNAPSE_02_INSTANCE  == 'true'}}
      run : |
        temp=$(az keyvault secret show --name ${{vars.SYNAPSE_KV_SECRETKEY_02_INSTANCE}} --vault-name ${{vars.AZ_GEN_KV_SECRET_SCOPE}} --query value -o tsv)
        echo "::add-mask::$temp"
        echo "synapse_token=$temp" >> "$GITHUB_OUTPUT"
        sed -i -E 's/\$[eE][nN][vV]|\$\([eE][nN][vV]\)|\$\{[eE][nN][vV]\}/ppd/g' ./sql/synapse_02_instance/${{steps.synapse_scripts_02_instance.outputs.synapse_script_02_instance}}.sql
        cat ./sql/synapse_02_instance/${{steps.synapse_scripts_02_instance.outputs.synapse_script_02_instance}}.sql
      id : synapse_secret_02_instance

    # Step 25.1 - Run SQL script in Synapse based on retrieved connection token
    - name : Synapse(02) managed instance automated run [ DDL script execution] ******** validation required  ********
      id : ddl_synapse_deployment_02_instance
      continue-on-error : true
      if : ${{ steps.synapse_scripts_02_instance.outputs.synapse_temp_02 == 'true' && steps.init.outputs.DEPLOY_SYNAPSE_02_INSTANCE == 'true'}}
      uses : azure/sql-action@v2.2
      with :
        connection-string : ${{steps.synapse_secret_02_instance.outputs.synapse_token}}
        path : ./sql/synapse_02_instance/${{steps.synapse_scripts_02_instance.outputs.synapse_script_02_instance}}.sql
 

    # Step 26 - Run SQL script in Databricks using databricks notebook run action
    - name : Databricks Execution [ DDL script automated run ] ******** validation required  ********
      id : ddl_dbx_deployment
      continue-on-error : true
      if : ${{ steps.scripts.outputs.temp == 'true' && steps.init.outputs.DATABRICKS_CONTROLLER  == 'true' && steps.init.outputs.DBX_AUTOMATED_DDL_CONTROLLER  == 'true' }}
      uses : databricks/run-notebook@v0
      with :
        workspace-notebook-path : /projects/${{needs.build.outputs.REPO_SHORT_NAME}}/sql/databricks/${{ steps.scripts.outputs.dbx_notebook }}
        databricks-host : ${{ vars.DATABRICKS_HOST_URL }}
        databricks-token : ${{steps.dbx_secret.outputs.dbx_token}}
        notebook-params-json :   "[{\"key\":\"env\",\"value\":\"ppd\"}]"
        timeout-seconds : ${{vars.DBX_PROCESS_TIMEOUT}}
        run-name : "https://github.com/DigitalInnovation/${{env.repo_name}} : ${{ steps.scripts.outputs.dbx_notebook }}"
        new-cluster-json: >
          {
            "num_workers": ${{vars.DBX_WORKER_COUNT}},
            "spark_version": "${{vars.DBX_RUNTIME_VERSION}}",
            "node_type_id": "${{vars.DBX_NODE_TYPE}}",
            "driver_node_type_id": "${{vars.DBX_NODE_TYPE}}",
            "init_scripts": [
              {
                "${{vars.DBX_INIT_SCRIPT_PLACEHOLDER}}": {
                  "destination": "${{vars.INIT_SCRIPT}}"
                }
              }
            ]
          }
      timeout-minutes: 30
    # Step 27 - Create tag for the current commit
    - name : Create tag
      run : |
        set -e
        trap 'git tag $current_tag && git push origin $current_tag && latest_tag=$(git describe --tags `git rev-list --tags --max-count=1`) && echo "latest tag=$latest_tag" && echo "Git describe command failed, but we are continuing..." && exit 0' ERR
        
        branch_name=${{env.source_branch}}
        echo "branch_name=$branch_name"
        
        #current_tag="v-${{env.commit_id}}"
        #prev_tag=$(git describe --tags `git rev-list --tags --max-count=1`)
        
        current_tag="$branch_name-${{env.commit_id}}"
        prev_tag=$(git log --tags --simplify-by-decoration --pretty="format:%ai %d" | grep -o 'tag: .*' | awk '{print substr($2, 1, length($2)-1)}' | grep -m1 ${{env.source_branch}})
        
        echo "current_tag=$current_tag"
        echo "prev_tag=$prev_tag"
        
        if [ "$prev_tag" = "$current_tag" ] ; then
          echo "Current tag already exists -- $current_tag"
        else
          git tag $current_tag
          git push origin $current_tag
          latest_tag=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "latest tag=$latest_tag" >> $GITHUB_ENV
        fi

    # Step 28 - Check if SQL deployment is success and update environment variable
    - name : Check deployment status
      id : deployment_status
      if : ${{ steps.ddl_azsqldb_deployment.outcome != 'success' || steps.ddl_synapse_deployment.outcome != 'success' || steps.ddl_dbx_deployment.outcome != 'success' }}
      run : |
        if [ "${{ steps.ddl_azsqldb_deployment.outcome }}" = "success" ] ; then
          echo "azsql_deployment=true" >> $GITHUB_ENV
        else 
          echo "azsql_deployment=false" >> $GITHUB_ENV
        fi
        if [ "${{ steps.ddl_synapse_deployment.outcome }}" = "success" ] ; then
          echo "synapse_deployment=true" >> $GITHUB_ENV
        else 
          echo "synapse_deployment=false" >> $GITHUB_ENV
        fi
        if [ "${{ steps.ddl_dbx_deployment.outcome }}" = "success" ] ; then
          echo "dbx_deployment=true" >> $GITHUB_ENV
        else 
          echo "dbx_deployment=false" >> $GITHUB_ENV
        fi

    # Step 29 - Storage Account Dynamic Whitelist removal for GitHub hosted runner
    - name : Storage Account Whitelist removal for GitHub hosted runner
      if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      shell : pwsh
      run : |
        $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
        write-output "GitHub Agent IP address '$agentIP'"
        az storage account network-rule remove --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} --ip-address $agentIP --resource-group ${{vars.AZURE_RESOURCE_GROUP}}

    # Step 30 - GEN and DBK Keyvault Dynamic Whitelist removal for GitHub hosted runner
    - name : Keyvault Whitelist removal for GitHub hosted runner
      if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      shell : pwsh
      run : |
        $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
        write-output "GitHub Agent IP address '$agentIP'"
        az keyvault network-rule remove --resource-group "${{vars.AZ_KV_RG}}" --name "${{vars.AZ_DBX_KV_SECRET_SCOPE}}" --ip-address $agentIP
        az keyvault network-rule remove --resource-group "${{vars.AZ_KV_RG}}" --name "${{vars.AZ_GEN_KV_SECRET_SCOPE}}" --ip-address $agentIP

    # Step 31 - Prod GEN Keyvault Whitelist for GitHub hosted runner
    - name : Prod Keyvault Whitelist for GitHub hosted runner - Check and add agent IP
      if: ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      shell: pwsh
      run : |
        $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
        write-output "GitHub Agent IP address '$agentIP'"
        az keyvault network-rule add --resource-group "${{vars.AZ_KV_RG_CENTRAL}}" --name "${{vars.AZ_GEN_KV_SECRET_SCOPE_CENTRAL}}" --ip-address $agentIP

    # Step 32 - Update audit log with required details with deployment status
    - name : Audit Log update
      run : |
        python ./.github/scripts/audit_update.py
      env :
        envname : "${{env.ENV_NAME}}"
        key_vault_name : ${{vars.AZ_GEN_KV_SECRET_SCOPE_CENTRAL}}
        secret_name : ${{vars.AUDIT_AZSQLDB_KV_SECRETKEY}}
        CLINET_ID : ${{env.CLINET_ID_PROD}}
        CLINET_SECRET : ${{env.CLINET_SECRET_PROD}}

    # Step 33 - Prod GEN Keyvault Whitelist removal for GitHub hosted runner
    - name : Prod Keyvault Whitelist removal for GitHub hosted runner
      if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      shell : pwsh
      run : |
        $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
        write-output "GitHub Agent IP address '$agentIP'"  
        az keyvault network-rule remove --resource-group "${{vars.AZ_KV_RG_CENTRAL}}" --name "${{vars.AZ_GEN_KV_SECRET_SCOPE_CENTRAL}}" --ip-address $agentIP

    # Step 34 - Azure logout for Prod service principal
    - name: Azure logout
      run: |
        az logout
      if: always()  

 
# PROD Deployment  
  deploy-to-PROD:
    name : Deploy to PROD
    # Runs for PR Merge event only and depends on Build stage
    if : github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.action=='closed'
    needs: [ build ]
    # Run on the runner label defined in the variable
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL) }}
    environment : 
      name : PROD
      #url : http://prod.myapp.com'
    outputs:
      script_folder_exists: ${{ steps.scripts.outputs.temp }} 
      dbx_notebook : ${{ steps.scripts.outputs.dbx_notebook }}
    steps: 

    # Step 1 - Login to Azure using Prod service principal
    - name : Login to Azure
      uses : azure/login@v1
      with : 
        creds : ${{secrets.AZURE_CREDENTIALS_PROD}}

    # Step 2 - Checkout the repository with fetch depth as 2
    - name : Checkout Source Code
      uses : actions/checkout@v3
      with : 
        fetch-depth: ${fetch_depth}

    # Step 3 - Download the artifacts from the build job
    - name : Download Artifacts
      uses : actions/download-artifact@v4
      with :
        path : published_package

    # Step 4 - Initialize variable to be used later on
    - name : Initialize variable
      id : init
      shell : bash
      run: |
        echo "DATABRICKS_CONTROLLER=${{ fromJSON(vars.ACTIVITY_CONTROLLER)['DEPLOY_DATABRICKS']}}" >> $GITHUB_OUTPUT
        echo "DEPLOY_CONFIG_CONTROLLER=${{ fromJSON(vars.ACTIVITY_CONTROLLER)['DEPLOY_CONFIG']}}" >> $GITHUB_OUTPUT
        echo "DEPLOY_SCHEMA_CONTROLLER=${{ fromJSON(vars.ACTIVITY_CONTROLLER)['DEPLOY_SCHEMA']}}" >> $GITHUB_OUTPUT
        echo "DEPLOY_JMS_CONTROLLER=${{ fromJSON(vars.ACTIVITY_CONTROLLER)['DEPLOY_JMS']}}" >> $GITHUB_OUTPUT
        echo "DBX_AUTOMATED_DDL_CONTROLLER=${{ fromJSON(vars.ACTIVITY_CONTROLLER)['DEPLOY_AUTOMATED_DDL_IN_DBX']}}" >> $GITHUB_OUTPUT
        echo "DEPLOY_AZSQL=${{ fromJSON(vars.ACTIVITY_CONTROLLER)['DEPLOY_AZURESQL']}}" >> $GITHUB_OUTPUT
        echo "DEPLOY_SYNAPSE=${{ fromJSON(vars.ACTIVITY_CONTROLLER)['DEPLOY_SYNAPSE']}}" >> $GITHUB_OUTPUT
        echo "DEPLOY_SYNAPSE_02_INSTANCE=${{ fromJSON(vars.ACTIVITY_CONTROLLER)['DEPLOY_SYNAPSE_02_INSTANCE']}}" >> $GITHUB_OUTPUT
        echo "ENV_NAME=PROD" >> $GITHUB_ENV

        echo "MQ_HOST=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['MQ_HOST']}}" >> $GITHUB_ENV
        echo "MQ_CHANNEL=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['MQ_CHANNEL']}}" >> $GITHUB_ENV
        echo "KAFKA_SERVERS_CONFLUENT=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['KAFKA_SERVERS_CONFLUENT']}}" >> $GITHUB_ENV
        echo "KAFKA_SERVERS_ENTERPRISE=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['KAFKA_SERVERS_ENTERPRISE']}}" >> $GITHUB_ENV
        echo "K8S_CLUSTER=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['K8S_CLUSTER']}}" >> $GITHUB_ENV
        echo "K8S_NAMESPACE=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['K8S_NAMESPACE']}}" >> $GITHUB_ENV
        echo "LANDING_ACCOUNT=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['LANDING_ACCOUNT']}}" >> $GITHUB_ENV
        echo "K8S_URL=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['K8S_URL']}}" >> $GITHUB_ENV
        echo "K8S_SECRET=${{ fromJSON(vars.JMS_DEPLOYMENT_PROD)['K8S_SECRET']}}" >> $GITHUB_ENV

    # Step 5 - Storage Account Dynamic Whitelist for GitHub hosted runner
    - name : Storage Account Whitelist for GitHub hosted runner - Check and add agent IP
      if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      shell : pwsh
      run : |
        $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
        write-output "GitHub Agent IP address '$agentIP'"
        write-output "Network rule list - "
        az storage account network-rule list --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} --resource-group ${{vars.AZURE_RESOURCE_GROUP}}
        az storage account network-rule add --resource-group ${{vars.AZURE_RESOURCE_GROUP}} --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} --ip-address $agentIP

    # Step 6 - GEN and DBK Keyvault Dynamic Whitelist for GitHub hosted runner
    - name : Keyvault Whitelist for GitHub hosted runner - Check and add agent IP
      if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      shell : pwsh
      run : |
        $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
        write-output "GitHub Agent IP address '$agentIP'"
        az keyvault network-rule add --resource-group "${{vars.AZ_KV_DBX_RG}}" --name "${{vars.AZ_DBX_KV_SECRET_SCOPE}}" --ip-address $agentIP
        az keyvault network-rule add --resource-group "${{vars.AZ_KV_RG}}" --name "${{vars.AZ_GEN_KV_SECRET_SCOPE}}" --ip-address $agentIP

    # Step 7.0 - Deploy Wheel files if present using Az CLI using service principal login
    - name : Deploy Wheel files in azure storage using Az CLI
      if : steps.init.outputs.DEPLOY_CONFIG_CONTROLLER == 'true'
      uses : azure/CLI@v1
      with :
        azcliversion : latest
        inlineScript : |
          if [[ -d ./published_package/assets-for-download/prophecy/pipelines/ ]] ; then
            ls
            az login --service-principal --username ${{env.CLINET_ID_PROD}} --password ${{env.CLINET_SECRET_PROD}} --tenant ${{env.TENANT_ID}}
            for dir in ./published_package/assets-for-download/prophecy/pipelines/*/; do prophecy_pipeline=$(basename "$dir"); ls ./published_package/assets-for-download/prophecy/pipelines/${prophecy_pipeline}/code/dist/*.whl; az storage blob upload-batch --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} -d 'projects' --destination-path ${{needs.build.outputs.REPO_SHORT_NAME}}/prophecy_executables -s ./published_package/assets-for-download/prophecy/pipelines/${prophecy_pipeline}/code/dist/   --overwrite  --auth-mode login; done            
          else
            echo "No Wheel file changes"
          fi	

    # Step 7 - Deploy config files if present using Az CLI using service principal login
    - name : Deploy config files to azure storage using Az CLI
      if : steps.init.outputs.DEPLOY_CONFIG_CONTROLLER == 'true'
      uses : azure/CLI@v1
      with :
        azcliversion: latest
        inlineScript: |
          if [[ -d ./published_package/assets-for-download/configs/ ]] ; then
            ls
            az login --service-principal --username ${{env.CLINET_ID_PROD}} --password ${{env.CLINET_SECRET_PROD}} --tenant ${{env.TENANT_ID}}
            az storage blob upload-batch --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} -d 'projects' --destination-path ${{needs.build.outputs.REPO_SHORT_NAME}}/configs -s ./published_package/assets-for-download/configs  --overwrite  --auth-mode login
          else
            echo "No Config file changes"
          fi

    # Step 8 - Deploy schema files if present using Az CLI using service principal login
    - name : Deploy schema files in azure storage using Az CLI
      if : steps.init.outputs.DEPLOY_SCHEMA_CONTROLLER == 'true'
      uses : azure/CLI@v1
      with :
        azcliversion : latest
        inlineScript : |
          if [[ -d ./published_package/assets-for-download/schemas/ ]] ; then
            ls
            az login --service-principal --username ${{env.CLINET_ID_PROD}} --password ${{env.CLINET_SECRET_PROD}} --tenant ${{env.TENANT_ID}}
            az storage blob upload-batch --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} -d 'projects' --destination-path ${{needs.build.outputs.REPO_SHORT_NAME}}/schemas -s ./published_package/assets-for-download/schemas --overwrite  --auth-mode login
          else
            echo "No schema file changes"
          fi

    # Step 9 - Deploy jms config files if present using Az CLI using service principal login
    - name : Deploy jms config files in azure storage using Az CLI
      if : steps.init.outputs.DEPLOY_JMS_CONTROLLER == 'true'
      uses : azure/CLI@v1
      with :
        azcliversion : latest
        inlineScript : |
          if [[ -d ./published_package/assets-for-download/jms/ ]] ; then
            ls
            az login --service-principal --username ${{env.CLINET_ID_PROD}} --password ${{env.CLINET_SECRET_PROD}} --tenant ${{env.TENANT_ID}}
            az storage blob upload-batch --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} -d 'projects' --destination-path ${{needs.build.outputs.REPO_SHORT_NAME}}/jms -s ./published_package/assets-for-download/jms --overwrite  --auth-mode login
          else
            echo "No jms config file changes"
          fi

    # Step 10 - Setup Python with required version
    - name : Setup python
      uses : actions/setup-python@v4
      with :
        python-version : ${{ vars.PYTHON_VERSION }}

    # Step 11 - Install ODBC Driver Manager for GitHub Hosted Runner
    - name : Install ODBC Driver Manager for GitHub Hosted Runner
      if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      run : |
        sudo curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
        sudo curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17
        # optional: for bcp and sqlcmd
        sudo ACCEPT_EULA=Y apt-get install -y mssql-tools
        echo 'export PATH="$PATH:/opt/mssql-tools/bin"' >> ~/.bashrc
        source ~/.bashrc
        # optional: for unixODBC development headers
        sudo apt-get install -y unixodbc-dev
        python -m pip install pyodbc

    # Step 12 - Install ODBC Driver Manager for Self Hosted Runner
    - name : Install ODBC Driver Manager for Self Hosted Runner
      if : ${{ !contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      run : bash .github/scripts/odbc_driver_install.sh

    # Step 13 - Install required python packages
    - name : install python packages
      continue-on-error : false
      run : |
        python -m pip install --upgrade pip
        pip install requests
        python -m pip install PyYAML
        pip install sendgrid

    # Step 14 - Get databricks token from Azure KeyVault
    - name : Get databricks token
      if :  steps.init.outputs.DATABRICKS_CONTROLLER  == 'true'
      run : |
        temp=$(az keyvault secret show --name ${{vars.AZ_DBX_KV_SECRET_KEY}} --vault-name ${{vars.AZ_DBX_KV_SECRET_SCOPE}} --query value -o tsv)
        echo "::add-mask::$temp"
        echo "dbx_token=$temp" >> "$GITHUB_OUTPUT"
      id : dbx_secret

    # Step 15 - Databricks CLI setup using databricks token
    - name : Databricks CLI setup to connect az KeyVault
      if : steps.init.outputs.DATABRICKS_CONTROLLER  == 'true'
      run : |
        pip install "databricks-cli==0.18.0" "pyjwt==2.11.0"
        cat > ~/.databrickscfg << EOF 
        [DEFAULT] 
        host = ${{ vars.DATABRICKS_HOST_URL }} 
        token = ${{steps.dbx_secret.outputs.dbx_token}} 
        jobs-api-version = 2.1 
        EOF

    # Step 16 - Deploy only changed notebooks in databricks workspace using databricks-cli
    - name : Databricks - Deploy notebooks to workspace
      if :  steps.init.outputs.DATABRICKS_CONTROLLER  == 'true'
      run : |
        if [[ -d ./published_package/assets-for-download/notebooks/ ]] ; then
          databricks workspace import_dir ./published_package/assets-for-download/notebooks/ /projects/${{needs.build.outputs.REPO_SHORT_NAME}}  --overwrite
        else
          echo "No Databricks Notebook exists in this commit"
        fi

    # Step 17 - Deploy ADLS SQL script if present in databricks workspace using databricks-cli
    - name : Databricks - Deploy DDL scripts to workspace
      if : steps.init.outputs.DATABRICKS_CONTROLLER  == 'true'
      id : scripts
      run : |
        if [[ -d ./published_package/assets-for-download/sql/databricks/ ]] ; then
          databricks workspace import_dir ./published_package/assets-for-download/sql/databricks/ /projects/${{needs.build.outputs.REPO_SHORT_NAME}}/sql/databricks  --overwrite
          echo "temp=true" >> $GITHUB_OUTPUT
          f=$(ls ./published_package/assets-for-download/sql/databricks/)
          for i in ${f}; do 
            echo "$i"; 
            done; 
          # expecting only one file in the folder
          IFS='.' read -ra arr <<< "$i"
          echo "dbx_notebook=${arr[0]}"

          IFS='.' read -ra arr <<< "$f"
          echo "dbx_notebook=${arr[0]}" >> $GITHUB_OUTPUT
        else
          echo "No Databricks Notebook exists in this commit"
          echo "temp=false" >> $GITHUB_OUTPUT
        fi

    # Step 18 - Check if JMS deployment required in this environment and if jms config changes present
    - name : Get jms status flag
      id : jms_status
      if : ${{steps.init.outputs.DEPLOY_JMS_CONTROLLER}} == 'true'
      run : |
        if [[ -d ./published_package/assets-for-download/jms/ ]] ; then
          echo "DEPLOY_JMS_CONTROLLER = ${{steps.init.outputs.DEPLOY_JMS_CONTROLLER}}" 
          echo "jms_deployment_status=true" >> $GITHUB_OUTPUT
          output_string=""
          append=","
          
          for file in ./published_package/assets-for-download/jms/*; do
            echo "Processing $file"
            filename=$(basename -- "$file")
            echo "filename=$filename"
            prefix_str="./jms/"
            prefix_str+="$filename"
            output_string+="$prefix_str$append"
            done

          result_string="${output_string%,}"
          echo "jms config=$result_string"
          echo "result_string=$result_string" >> "$GITHUB_OUTPUT"
        else
          echo "No jms deployment"
          echo "jms_deployment_status=false"
          echo "DEPLOY_JMS_CONTROLLER = ${{env.DEPLOY_JMS_CONTROLLER}}"
          echo "jms_deployment_status=false" >> $GITHUB_OUTPUT
        fi

    # Step 19 - Generate values.yaml using template and provided jms configs
    - name : python script to generate jms values
      if : ${{ steps.jms_status.outputs.jms_deployment_status == 'true'  && steps.init.outputs.DEPLOY_JMS_CONTROLLER == 'true' }}
      run : python ./.github/scripts/trigger_jms_deployment.py
      env :
        TENANT_ID : ${{env.TENANT_ID}}
        SUBSCRIPTION_ID : ${{env.SUBSCRIPTION_ID_PROD}}
        ENVIRONMENT_SHORT : ${{env.ENV_NAME}}
        JMS_CONFIG : ${{steps.jms_status.outputs.result_string}}
        MQ_HOST : ${{env.MQ_HOST}}
        MQ_CHANNEL : ${{env.MQ_CHANNEL}}
        KAFKA_SERVERS_CONFLUENT : ${{env.KAFKA_SERVERS_CONFLUENT}}
        KAFKA_SERVERS_ENTERPRISE : ${{env.KAFKA_SERVERS_ENTERPRISE}}
        K8S_CLUSTER : ${{env.K8S_CLUSTER}}
        K8S_NAMESPACE : ${{env.K8S_NAMESPACE}}
        LANDING_ACCOUNT : ${{env.LANDING_ACCOUNT}}
        K8S_URL : ${{env.K8S_URL}}
        K8S_SECRET : ${{env.K8S_SECRET}}
        authorization_pat : ${{ env.GH_TOKEN }}
        repo_name : ${{ env.repo_name }}
        ref_branch : ${{ github.base_ref }}

    # Step 20 - Identify SQL scripts (if any) in current PR for AzSQLDB deployment
    - name : Identify SQL scripts for AzSQLDB deployment
      continue-on-error : true
      if : steps.init.outputs.DEPLOY_AZSQL  == 'true'
      id : azsqldb_scripts
      run : |
        if [[ -d ./published_package/assets-for-download/sql/azsqldb/ ]] ; then
          echo "sql_temp=true" >> $GITHUB_OUTPUT
          f=$(ls ./published_package/assets-for-download/sql/azsqldb/)
          for i in ${f}; do 
            echo "$i"; 
            done; 
          # expecting only one file in the folder
          IFS='.' read -ra arr <<< "$i"
          echo "azsqldb_script=${arr[0]}"

          IFS='.' read -ra arr <<< "$f"
          echo "azsqldb_script=${arr[0]}" >> $GITHUB_OUTPUT
        else
          echo "No AzSQL DB script exists in this commit"
          echo "sql_temp=false" >> $GITHUB_OUTPUT
        fi

    # Step 21 - Get AzSQL DB connection token from GEN KeyVault and replace environment variables in the SQL script
    - name : Get AzSQL DB connection token
      continue-on-error : true
      if : ${{ steps.azsqldb_scripts.outputs.sql_temp == 'true' && steps.init.outputs.DEPLOY_AZSQL  == 'true'}}
      run : |
        temp=$(az keyvault secret show --name ${{vars.AZSQLDB_KV_SECRETKEY}} --vault-name ${{vars.AZ_GEN_KV_SECRET_SCOPE}} --query value -o tsv)
        echo "::add-mask::$temp"
        echo "azsql_token=$temp" >> "$GITHUB_OUTPUT"
        sed -i -E 's/\$[eE][nN][vV]|\$\([eE][nN][vV]\)|\$\{[eE][nN][vV]\}/prod/g' ./sql/azsqldb/${{steps.azsqldb_scripts.outputs.azsqldb_script}}.sql
        cat ./sql/azsqldb/${{steps.azsqldb_scripts.outputs.azsqldb_script}}.sql
      id : azsql_secret

    # Step 22 - Run AzSQL script in AzSQL DB based on retrieved connection token
    - name : AzSQLDB automated run [ DDL script execution] ******** validation required  ********
      id : ddl_azsqldb_deployment
      continue-on-error : true
      if : ${{ steps.azsqldb_scripts.outputs.sql_temp == 'true' && steps.init.outputs.DEPLOY_AZSQL  == 'true'}}
      uses : azure/sql-action@v2.2
      with :
        connection-string : ${{steps.azsql_secret.outputs.azsql_token}}
        path: ./sql/azsqldb/${{steps.azsqldb_scripts.outputs.azsqldb_script}}.sql

    # Step 23 - Identify SQL scripts (if any) in current PR for Synapse deployment
    - name : Identify SQL scripts for Synapse deployment
      continue-on-error : true
      if :  steps.init.outputs.DEPLOY_SYNAPSE  == 'true'
      id : synapse_scripts
      run : |
        if [[ -d ./published_package/assets-for-download/sql/synapse/ ]] ; then
          echo "synapse_temp=true" >> $GITHUB_OUTPUT
          f=$(ls ./published_package/assets-for-download/sql/synapse/)
          for i in ${f}; do 
            echo "$i";
            done;
          # expecting only one file in the folder
          IFS='.' read -ra arr <<< "$i"
          echo "synapse_script=${arr[0]}"

          IFS='.' read -ra arr <<< "$f"
          echo "synapse_script=${arr[0]}" >> $GITHUB_OUTPUT
        else
          echo "No synapse script exists in this commit"
          echo "synapse_temp=false" >> $GITHUB_OUTPUT
        fi

    # Step 24 - Get Synapse connection token from GEN KeyVault and replace environment variables in the SQL script
    - name : Get Synapse connection token
      continue-on-error : true
      if : ${{ steps.synapse_scripts.outputs.synapse_temp == 'true' && steps.init.outputs.DEPLOY_SYNAPSE  == 'true'}}
      run : |
        temp=$(az keyvault secret show --name ${{vars.SYNAPSE_KV_SECRETKEY}} --vault-name ${{vars.AZ_GEN_KV_SECRET_SCOPE}} --query value -o tsv)
        echo "::add-mask::$temp"
        echo "synapse_token=$temp" >> "$GITHUB_OUTPUT"
        sed -i -E 's/\$[eE][nN][vV]|\$\([eE][nN][vV]\)|\$\{[eE][nN][vV]\}/prod/g' ./sql/synapse/${{steps.synapse_scripts.outputs.synapse_script}}.sql
        cat ./sql/synapse/${{steps.synapse_scripts.outputs.synapse_script}}.sql
      id : synapse_secret

    # Step 25 - Run SQL script in Synapse based on retrieved connection token
    - name : Synapse automated run [ DDL script execution] ******** validation required  ********
      id : ddl_synapse_deployment
      continue-on-error : true
      if : ${{ steps.synapse_scripts.outputs.synapse_temp == 'true' && steps.init.outputs.DEPLOY_SYNAPSE == 'true'}}
      uses : azure/sql-action@v2.2
      with :
        connection-string : ${{steps.synapse_secret.outputs.synapse_token}}
        path : ./sql/synapse/${{steps.synapse_scripts.outputs.synapse_script}}.sql
        
        
    # Step 23.1 - Identify SQL scripts (if any) in current PR for Synapse 02 instance deployment
    - name : Identify SQL scripts for Synapse 02 instance deployment
      continue-on-error : true
      if :  steps.init.outputs.DEPLOY_SYNAPSE_02_INSTANCE  == 'true'
      id : synapse_scripts_02_instance
      run : |
        if [[ -d ./published_package/assets-for-download/sql/synapse_02_instance/ ]] ; then
          echo "synapse_temp_02=true" >> $GITHUB_OUTPUT
          f=$(ls ./published_package/assets-for-download/sql/synapse_02_instance/)
          for i in ${f}; do 
            echo "$i"; 
            done; 
          # expecting only one file in the folder
          IFS='.' read -ra arr <<< "$i"
          echo "synapse_script_02_instance=${arr[0]}"

          IFS='.' read -ra arr <<< "$f"
          echo "synapse_script_02_instance=${arr[0]}" >> $GITHUB_OUTPUT
        else
          echo "No synapse script exists in this commit"
          echo "synapse_temp_02=false" >> $GITHUB_OUTPUT
        fi


    # Step 24.1 - Get Synapse connection token(for 02 instance) from GEN KeyVault and replace environment variables in the SQL script
    - name : Get connection token for synapse 02 instance (synapse managed)
      continue-on-error : true
      if : ${{ steps.synapse_scripts_02_instance.outputs.synapse_temp_02 == 'true' && steps.init.outputs.DEPLOY_SYNAPSE_02_INSTANCE  == 'true'}}
      run : |
        temp=$(az keyvault secret show --name ${{vars.SYNAPSE_KV_SECRETKEY_02_INSTANCE}} --vault-name ${{vars.AZ_GEN_KV_SECRET_SCOPE}} --query value -o tsv)
        echo "::add-mask::$temp"
        echo "synapse_token=$temp" >> "$GITHUB_OUTPUT"
        sed -i -E 's/\$[eE][nN][vV]|\$\([eE][nN][vV]\)|\$\{[eE][nN][vV]\}/prod/g' ./sql/synapse_02_instance/${{steps.synapse_scripts_02_instance.outputs.synapse_script_02_instance}}.sql
        cat ./sql/synapse_02_instance/${{steps.synapse_scripts_02_instance.outputs.synapse_script_02_instance}}.sql
      id : synapse_secret_02_instance


    # Step 25.1 - Run SQL script in Synapse based on retrieved connection token
    - name : Synapse(02) managed instance automated run [ DDL script execution] ******** validation required  ********
      id : ddl_synapse_deployment_02_instance
      continue-on-error : true
      if : ${{ steps.synapse_scripts_02_instance.outputs.synapse_temp_02 == 'true' && steps.init.outputs.DEPLOY_SYNAPSE_02_INSTANCE == 'true'}}
      uses : azure/sql-action@v2.2
      with :
        connection-string : ${{steps.synapse_secret_02_instance.outputs.synapse_token}}
        path : ./sql/synapse_02_instance/${{steps.synapse_scripts_02_instance.outputs.synapse_script_02_instance}}.sql


    # Step 26 - Run SQL script in Databricks using databricks notebook run action
    - name : Databricks Execution [ DDL script automated run ] ******** validation required  ********
      id : ddl_dbx_deployment
      continue-on-error : true
      if : ${{ steps.scripts.outputs.temp == 'true' && steps.init.outputs.DATABRICKS_CONTROLLER  == 'true' && steps.init.outputs.DBX_AUTOMATED_DDL_CONTROLLER  == 'true' }}
      uses : databricks/run-notebook@v0
      with :
        workspace-notebook-path : /projects/${{needs.build.outputs.REPO_SHORT_NAME}}/sql/databricks/${{ steps.scripts.outputs.dbx_notebook }}
        databricks-host : ${{ vars.DATABRICKS_HOST_URL }}
        databricks-token : ${{steps.dbx_secret.outputs.dbx_token}}
        notebook-params-json :   "[{\"key\":\"env\",\"value\":\"prod\"}]"
        timeout-seconds : ${{vars.DBX_PROCESS_TIMEOUT}}
        run-name : "https://github.com/DigitalInnovation/${{env.repo_name}} : ${{ steps.scripts.outputs.dbx_notebook }}"
        new-cluster-json: >
          {
            "num_workers": ${{vars.DBX_WORKER_COUNT}},
            "spark_version": "${{vars.DBX_RUNTIME_VERSION}}",
            "node_type_id": "${{vars.DBX_NODE_TYPE}}",
            "driver_node_type_id": "${{vars.DBX_NODE_TYPE}}",
            "init_scripts": [
              {
                "${{vars.DBX_INIT_SCRIPT_PLACEHOLDER}}": {
                  "destination": "${{vars.INIT_SCRIPT}}"
                }
              }
            ]
          }
      timeout-minutes: 30
    # Step 27 - Update change log for the current changes
    - name : Update change log
      run : python ./.github/scripts/changelog_capture.py
      env :
        CLINET_ID : ${{env.CLINET_ID_PROD}}
        CLINET_SECRET : ${{env.CLINET_SECRET_PROD}}
        key_vault_name : ${{vars.AZ_GEN_KV_SECRET_SCOPE_CENTRAL}}
        sqldb_secret_name : ${{vars.AUDIT_AZSQLDB_KV_SECRETKEY}}
        PAT_GITHUB_SECRET_KEY : ${{vars.PAT_GITHUB_SECRET_KEY}}
        github_api_version : ${{vars.GH_API_VERSION}}

    # Step 28 - Check if SQL deployment is success and update environment variable
    - name : Check deployment status
      id : deployment_status
      if : ${{ steps.ddl_azsqldb_deployment.outcome != 'success' || steps.ddl_synapse_deployment.outcome != 'success' || steps.ddl_dbx_deployment.outcome != 'success' }}
      run : |
        if [ "${{ steps.ddl_azsqldb_deployment.outcome }}" = "success" ] ; then
          echo "azsql_deployment=true" >> $GITHUB_ENV
        else 
          echo "azsql_deployment=false" >> $GITHUB_ENV
        fi
        if [ "${{ steps.ddl_synapse_deployment.outcome }}" = "success" ] ; then
          echo "synapse_deployment=true" >> $GITHUB_ENV
        else 
          echo "synapse_deployment=false" >> $GITHUB_ENV
        fi
        if [ "${{ steps.ddl_dbx_deployment.outcome }}" = "success" ] ; then
          echo "dbx_deployment=true" >> $GITHUB_ENV
        else 
          echo "dbx_deployment=false" >> $GITHUB_ENV
        fi

    # Step 29 - Sendout mail in case of hotfix deployment
    - name : Hotfix Deployment SendEmail
      if : github.event_name == 'pull_request' && startsWith(github.head_ref,'hf')
      run : python ./.github/scripts/hotfixdeployment_sendemail.py
      env :
        CLINET_ID : ${{env.CLINET_ID_PROD}}
        CLINET_SECRET : ${{env.CLINET_SECRET_PROD}}
        key_vault_name : ${{vars.AZ_GEN_KV_SECRET_SCOPE_CENTRAL}}
        PAT_GITHUB_SECRET_KEY : ${{vars.PAT_GITHUB_SECRET_KEY}}
        github_api_version : ${{vars.GH_API_VERSION}}

    # Step 30 - Update audit log with required details with deployment status
    - name : Audit log update
      run : |
        python ./.github/scripts/audit_update.py
      env :
        envname : "${{env.ENV_NAME}}"  
        key_vault_name : ${{vars.AZ_GEN_KV_SECRET_SCOPE_CENTRAL}}
        secret_name : ${{vars.AUDIT_AZSQLDB_KV_SECRETKEY}}
        CLINET_ID : ${{env.CLINET_ID_PROD}}
        CLINET_SECRET : ${{env.CLINET_SECRET_PROD}}

    # Step 31 - Storage Account Dynamic Whitelist removal for GitHub hosted runner
    - name : Storage Account Whitelist removal for GitHub hosted runner
      if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      shell : pwsh
      run : |
        $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
        write-output "GitHub Agent IP address '$agentIP'"
        az storage account network-rule remove --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} --ip-address $agentIP --resource-group ${{vars.AZURE_RESOURCE_GROUP}}

    # Step 32 - GEN and DBK Keyvault Dynamic Whitelist removal for GitHub hosted runner
    - name : Keyvault Whitelist removal for GitHub hosted runner
      if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
      shell : pwsh
      run : |
        $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
        write-output "GitHub Agent IP address '$agentIP'"
        az keyvault network-rule remove --resource-group "${{vars.AZ_KV_DBX_RG}}" --name "${{vars.AZ_DBX_KV_SECRET_SCOPE}}" --ip-address $agentIP
        az keyvault network-rule remove --resource-group "${{vars.AZ_KV_RG}}" --name "${{vars.AZ_GEN_KV_SECRET_SCOPE}}" --ip-address $agentIP

    # Step 33 - Azure logout for Prod service principal
    - name: Azure logout
      run: |
        az logout
      if: always() 
