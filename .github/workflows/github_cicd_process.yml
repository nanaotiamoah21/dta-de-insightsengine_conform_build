        az storage account network-rule add --resource-group ${{vars.AZURE_RESOURCE_GROUP}} --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} --ip-address $agentIP

    # Step 6 - GEN and DBK Kayvault Dynamic Whitelist for GitHub hosted runner
