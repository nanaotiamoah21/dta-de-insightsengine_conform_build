          for dir in ./published_package/assets-for-download/prophecy/pipelines/*/; do prophecy_pipeline=$(basename "$dir"); ls ./published_package/assets-for-download/prophecy/pipelines/${prophecy_pipeline}/code/dist/*.whl; az storage blob upload-batch --account-name ${{vars.BLOB_STORAGE_ACCOUNT_NAME}} -d 'projects' --destination-path ${{needs.build.outputs.REPO_SHORT_NAME}}/prophecy_executables -s ./published_package/assets-for-download/prophecy/pipelines/${prophecy_pipeline}/code/dist/   --overwrite  --auth-mode login; done            
