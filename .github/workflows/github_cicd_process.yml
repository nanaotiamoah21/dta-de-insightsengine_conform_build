        $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
        write-output "GitHub Agent IP address '$agentIP'"
        az keyvault network-rule add --resource-group "${{vars.AZ_KV_RG}}" --name "${{vars.AZ_DBX_KV_SECRET_SCOPE}}" --ip-address $agentIP
        az keyvault network-rule add --resource-group "${{vars.AZ_KV_RG}}" --name "${{vars.AZ_GEN_KV_SECRET_SCOPE}}" --ip-address $agentIP

    # Step 7.0 - Deploy Wheel files if present using Az CLI
    - name : Deploy Wheel files in azure storage using Az CLI
      if : steps.init.outputs.DEPLOY_CONFIG_CONTROLLER == 'true'
      shell : bash
      run : |
        if [[ -d ./published_package/assets-for-download/prophecy/pipelines/ ]] ; then
