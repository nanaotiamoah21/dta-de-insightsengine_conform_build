name: Production Review Approval Process

env:

# [ Declare general variables required for workflow ]
  
  repo_name: ${{ github.event.repository.name }}
  github_token: ${{ github.token }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  fetch_depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}  
  repo_owner: ${{ github.event.repository.owner.login }}
  pr_number : ${{ github.event.pull_request.number || github.event.issue.number }}
  pr_title: ${{ github.event.pull_request.title }}
  github_api_version: ${{vars.GH_API_VERSION}}

# [ Azure Service Principal Credentials declared as secret for Non-Prod ]
  AZURE_CREDENTIALS_NON_PROD: ${{secrets.AZURE_CREDENTIALS_NON_PROD}}
  CLINET_ID_NON_PROD : ${{ fromJSON(secrets.AZURE_CREDENTIALS_NON_PROD)['clientId']}}
  CLINET_SECRET_NON_PROD : ${{ fromJSON(secrets.AZURE_CREDENTIALS_NON_PROD)['clientSecret']}}
  SUBSCRIPTION_ID_NON_PROD : ${{ fromJSON(secrets.AZURE_CREDENTIALS_NON_PROD)['subscriptionId']}}
  TENANT_ID : ${{ fromJSON(secrets.AZURE_CREDENTIALS_NON_PROD)['tenantId']}}

# [ Azure Service Principal Credentials declared as secret for Prod ] 
  AZURE_CREDENTIALS_PROD: ${{secrets.AZURE_CREDENTIALS_PROD}}
  CLINET_ID_PROD : ${{ fromJSON(secrets.AZURE_CREDENTIALS_PROD)['clientId']}}
  CLINET_SECRET_PROD : ${{ fromJSON(secrets.AZURE_CREDENTIALS_PROD)['clientSecret']}}
  SUBSCRIPTION_ID_PROD : ${{ fromJSON(secrets.AZURE_CREDENTIALS_PROD)['subscriptionId']}}

on:
  # Trigger the workflow on whenever pull request review is submitted 
  pull_request_review:
    types: [submitted]
    branches:
      - 'main'

jobs:
  Prod_review_required:
    # Runs on Github hosted runner with ubuntu-latest
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL) }}
    steps:

      # Checkout the repository with fetch depth as 2
      - uses: actions/checkout@v3
        with:
          fetch-depth: ${fetch_depth}

      # Login to Azure using Service Principal for Prod
      - name : Login to Azure
        uses : azure/login@v1
        with : 
          creds : ${{env.AZURE_CREDENTIALS_PROD}}

      # Prod GEN KeyVault Dynamic Whitelist for GitHub hosted runner
      - name : KeyVault Whitelist for GitHub hosted runner - Check and add agent IP
        if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
        shell : pwsh
        run : |
          $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
          write-output "GitHub Agent IP address '$agentIP'"
          az keyvault network-rule add --resource-group "${{vars.AZ_KV_RG_CENTRAL}}" --name "${{vars.AZ_GEN_KV_SECRET_SCOPE_CENTRAL}}" --ip-address $agentIP

      # Set up python with required version
      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ vars.PYTHON_VERSION }}

      # Install ODBC Driver Manager for GitHub Hosted Runner
      - name : Install ODBC Driver Manager for GitHub Hosted Runner
        if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
        run : |
          sudo curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          sudo curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17
          # optional: for bcp and sqlcmd
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools
          echo 'export PATH="$PATH:/opt/mssql-tools/bin"' >> ~/.bashrc
          source ~/.bashrc
          # optional: for unixODBC development headers
          sudo apt-get install -y unixodbc-dev
          python -m pip install pyodbc

      # Install ODBC driver Manager for Self Hosted Runner
      - name : Install ODBC Driver Manager for Self Hosted Runner
        if : ${{ !contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
        run : bash .github/scripts/odbc_driver_install.sh

      # Install Python package
      - name: Install Python package
        continue-on-error: false
        run: |
          pip install --upgrade pip
          pip install requests

      # Get Source Branch name from Pull Request and set it as environment variable
      - name: Get Source Branch
        shell: python
        run: |
          import requests
          import os
          organization = os.environ['repo_owner']
          repo_name = os.environ['repo_name']
          pull_request_id = os.environ['pr_number']
          github_token = os.environ['GH_TOKEN']
          github_api_version = os.environ['github_api_version']

          headers = {
            'Accept': 'application/vnd.github+json',
            'Authorization': f'Bearer {github_token}',
            'X-GitHub-Api-Version': github_api_version,
          }
          env_file = os.getenv('GITHUB_ENV')
          pull_request_url = f'https://api.github.com/repos/{organization}/{repo_name}/pulls/{pull_request_id}'
          pull_request_data = requests.get(pull_request_url, headers=headers, timeout=60)
          if pull_request_data.status_code == 200:
            pull_request_info = pull_request_data.json()
            source_branch_name = pull_request_info['head']['ref']
            print(source_branch_name)
            with open(env_file, "a") as myfile:
              myfile.write(f"source_branch={source_branch_name}")

      # Check count of PR approval for feature branch and fail the workflow if count is less than required count
      # Use Prod Service Principal credentials and Prod KeyVault to fetch required secrets
      - name: PR approval count checks for feature branch
        if: ${{ startsWith(env.source_branch, 'feature') }}
        run: python ./.github/scripts/pr_approval_count_check_for_prod.py
        env:
          CLINET_ID: ${{env.CLINET_ID_PROD}}
          CLINET_SECRET: ${{env.CLINET_SECRET_PROD}}
          key_vault_name: ${{vars.AZ_GEN_KV_SECRET_SCOPE_CENTRAL}}
          sqldb_secret_name: ${{vars.AUDIT_AZSQLDB_KV_SECRETKEY}}
          metadatatabname: ${{vars.GITHUBTEAMMETADATATABLE}}
          PAT_GITHUB_SECRET_KEY: ${{vars.PAT_GITHUB_SECRET_KEY}}
          github_api_version: ${{vars.GH_API_VERSION}}

      # Check count of PR approval for hotfix branch and fail the workflow if count is less than required count
      # Use Prod Service Principal credentials and Prod KeyVault to fetch required secrets
      - name: PR approval count checks for hotfix branch
        if: ${{ startsWith(env.source_branch, 'hf') }}
        run: python ./.github/scripts/pr_approval_count_check_for_prod_hotfix.py
        env:
          CLINET_ID: ${{env.CLINET_ID_PROD}}
          CLINET_SECRET: ${{env.CLINET_SECRET_PROD}}
          key_vault_name: ${{vars.AZ_GEN_KV_SECRET_SCOPE_CENTRAL}}
          sqldb_secret_name: ${{vars.AUDIT_AZSQLDB_KV_SECRETKEY}}
          metadatatabname: ${{vars.GITHUBTEAMMETADATATABLE}}
          PAT_GITHUB_SECRET_KEY: ${{vars.PAT_GITHUB_SECRET_KEY}}
          github_api_version: ${{vars.GH_API_VERSION}}

      # Get latest tag and last commit for feature branch
      - name: Get tag and Pull number
        if: ${{ startsWith(env.source_branch, 'feature') }}
        working-directory: ${{github.workspace}}
        run: |
          echo "$(git fetch --all --tags)"
          #echo "latest_tag=$(git describe --tags `git rev-list --tags --max-count=1`)" >> $GITHUB_ENV

          echo "latest_tag=$(git log --tags --simplify-by-decoration --pretty="format:%ai %d" | grep -o 'tag: .*' | awk '{print substr($2, 1, length($2)-1)}' | grep -m1 ${{env.source_branch}})"
          echo "latest_tag=$(git log --tags --simplify-by-decoration --pretty="format:%ai %d" | grep -o 'tag: .*' | awk '{print substr($2, 1, length($2)-1)}' | grep -m1 ${{env.source_branch}})" >> $GITHUB_ENV

          echo "PULL_NUMBER=$(echo "$GITHUB_REF" | awk -F / '{print $3}')" >> $GITHUB_ENV
          #echo "new_tag=$(git tag | sort -V | head -1)" >> $GITHUB_ENV
          echo "commit_id=${{github.event.pull_request.head.sha}}" >> $GITHUB_ENV

      # Validate latest tag and last commit for feature branch and fail the workflow if mismatches
      - name: Tag and commit validation
        if: ${{ startsWith(env.source_branch, 'feature') }}      
        shell: python
        run: |
          import requests
          organization = '${{env.repo_owner}}'
          headers = {
            'Accept': 'application/vnd.github+json',
            'Authorization': f'Bearer ${{ env.GH_TOKEN }}',
            'X-GitHub-Api-Version': '2022-11-28',
          }
          print(f"tag: ${{ env.latest_tag }}")
          #print(f"commit: v-${{ env.commit_id }}")
          print(f"commit: ${{env.source_branch}}-${{ env.commit_id }}")
          #echo "new_tag: ${{ env.new_tag }}"
          if '${{ env.latest_tag }}' == '${{env.source_branch}}-${{ env.commit_id }}':
            print("tag matching")
          else:
            print("tag not matching")
            requests.patch(f'https://api.github.com/repos/{organization}/${{ github.event.repository.name }}/pulls/${{ env.pr_number }}', headers=headers, json={"body":"Invalid PR due to tag and commit mismatch so closing","state":"closed"})
            raise Exception('Invalid PR due to tag and commit mismatch so closing')

      # KeyVault Dynamic Whitelist removal for GitHub hosted runner
      - name : KeyVault Whitelist removal for GitHub hosted runner - Check and add agent IP
        if : ${{ contains(vars.RUNNER_LABEL,'ubuntu-latest') }}
        shell: pwsh
        run : |
          $agentIP = (Invoke-WebRequest -uri "http://ifconfig.me/ip").Content
          write-output "GitHub Agent IP address '$agentIP'"
          az keyvault network-rule remove --resource-group "${{vars.AZ_KV_RG_CENTRAL}}" --name "${{vars.AZ_GEN_KV_SECRET_SCOPE_CENTRAL}}" --ip-address $agentIP
      
      # Azure logout
      - name: Azure logout
        run: |
          az logout
        if: always()
